name: release-please

# Keeps a release pull request open on main: it bumps the version from the Conventional Commits titles
# since the last release and writes the changelog. Merging it tags the release and makes the GitHub
# Release. docs/releasing.md says how.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
